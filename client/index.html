<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1" />
    <title>GeoOzge - Learn Geography</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;700&family=Open+Sans:wght@400;600&family=Poppins:wght@400;500&display=swap" rel="stylesheet">
    <style>
      /* Custom styles for flip card and other elements */
      .flip-card {
        perspective: 1000px;
        height: 240px;
      }
      .flip-card-inner {
        transition: transform 0.6s;
        transform-style: preserve-3d;
        position: relative;
        width: 100%;
        height: 100%;
      }
      .flipped .flip-card-inner {
        transform: rotateY(180deg);
      }
      .flip-card-front, .flip-card-back {
        position: absolute;
        width: 100%;
        height: 100%;
        -webkit-backface-visibility: hidden;
        backface-visibility: hidden;
        display: flex;
        align-items: center;
        justify-content: center;
        flex-direction: column;
      }
      .flip-card-back {
        transform: rotateY(180deg);
      }
      
      .progress-ring {
        transform: rotate(-90deg);
      }
      
      .attraction-slide {
        opacity: 0;
        transition: opacity 0.5s ease-in-out;
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
      }
      
      .attraction-slide.active {
        opacity: 1;
        z-index: 1;
      }
      
      .fact-slide {
        opacity: 0;
        transition: opacity 0.5s ease-in-out;
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
      }
      
      .fact-slide.active {
        opacity: 1;
        z-index: 1;
      }
      
      .profile-popup {
        display: none;
        position: absolute;
        top: 60px;
        right: 10px;
        z-index: 50;
        transition: all 0.3s ease;
      }
      
      .profile-container:hover .profile-popup {
        display: block;
      }

      /* Custom font classes to match design */
      .font-heading {
        font-family: 'Montserrat', sans-serif;
      }
      .font-body {
        font-family: 'Open Sans', sans-serif;
      }
      .font-accent {
        font-family: 'Poppins', sans-serif;
      }

      /* Add custom color variables to match the design */
      :root {
        --primary: #3B82F6;   /* Blue for water/oceans */
        --secondary: #10B981; /* Green for land */
        --accent: #F59E0B;    /* Amber for highlights */
        --success: #10B981;   /* Green for correct answers */
        --error: #EF4444;     /* Red for incorrect answers */
      }
    </style>
  </head>
  <body class="font-body">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <!-- This is a replit script which adds a banner on the top of the page when opened in development mode outside the replit environment -->
    <script type="text/javascript" src="https://replit.com/public/js/replit-dev-banner.js"></script>
  </body>
</html>
